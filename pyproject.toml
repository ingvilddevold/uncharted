[project]
name = "uncharted"
version = "0.1.0"
description = "Map which streets you have run, from Garmin Connect activities and OpenStreetMap."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fitdecode>=0.10",
    "osmnx>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=16",
    "folium>=0.17",
    "typer>=0.12",
]

[project.scripts]
uncharted = "uncharted.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncharted"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
